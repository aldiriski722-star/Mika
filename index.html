<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mika</title>
<style>
body{margin:0;font-family:sans-serif;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow-y:auto;padding:10px}
.m{margin:6px 0;padding:8px 12px;border-radius:12px;max-width:80%;width:fit-content}
.u{background:#4a4e9c;margin-left:auto}.b{background:#2d2d4d}
#bar{display:flex;gap:6px;padding:8px}
input{flex:1;padding:10px;border-radius:10px;border:0}
button{padding:10px 14px;border:0;border-radius:10px;background:#e94560;color:#fff}
</style></head><body>
<div id="chat"></div>
<div id="bar"><input id="in" placeholder="Ketik di sini..."><button id="kirim">Kirim</button></div>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("in");
function tampil(kelas, teks) {
  const d = document.createElement("div");
  d.className = "m " + kelas;
  d.textContent = teks;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function kirim() {
  const t = input.value.trim();
  if (!t) return;
  input.value = "";
  tampil("u", t);
  tampil("b", "Aku belum punya otak, Lek.");
}
document.getElementById("kirim").onclick = kirim;
input.onkeydown = e => { if (e.key === "Enter") kirim(); };
</script>
</body></html>
