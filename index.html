<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mika AI Chatbot</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ----------------------------------------------------
           1. CONTAINER LIVE2D (BAGIAN ATAS)
        ---------------------------------------------------- */
        #live2d-container {
            width: 100%;
            height: 55vh;
            position: relative;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
            touch-action: none;
        }

        #live2d-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Status Engine AI (Loading Model 1.5B) */
        #ai-status {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(11, 12, 16, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(102, 252, 241, 0.3);
            color: #66fcf1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 5;
        }

        /* ----------------------------------------------------
           2. CONTAINER CHAT UI (BAGIAN BAWAH)
        ---------------------------------------------------- */
        #chat-container {
            height: 45vh;
            background: #1f2833;
            border-top: 1px solid #45a29e;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            padding: 14px;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
            margin-bottom: 12px;
            scroll-behavior: smooth;
        }

        #chat-history::-webkit-scrollbar {
            width: 4px;
        }
        #chat-history::-webkit-scrollbar-thumb {
            background: #45a29e;
            border-radius: 4px;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.45;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: #45a29e;
            color: #0b0c10;
            font-weight: 500;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background: #0b0c10;
            color: #c5c6c7;
            border: 1px solid #1f2833;
            border-bottom-left-radius: 2px;
        }

        .input-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #45a29e;
            background: #0b0c10;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        #user-input:focus {
            border-color: #66fcf1;
            box-shadow: 0 0 8px rgba(102, 252, 241, 0.3);
        }

        #send-btn {
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            background: #66fcf1;
            color: #0b0c10;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        #send-btn:active {
            transform: scale(0.95);
            background: #45a29e;
        }
    </style>

    <!-- LIBRARY LIVE2D (PIXIJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
</head>
<body>

    <!-- STATUS INDICATOR -->
    <div id="ai-status">Mika AI: Initializing...</div>

    <!-- AREA LIVE2D -->
    <div id="live2d-container">
        <canvas id="live2d-canvas"></canvas>
    </div>

    <!-- AREA CHAT UI -->
    <div id="chat-container">
        <div id="chat-history">
            <div class="message ai-msg">
                <b>Mika:</b> Halo Lek! Otak 1.5B & Hiyori siap dimuat. 🍸🗿
            </div>
        </div>
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Ketik pesan di sini..." autocomplete="off">
            <button id="send-btn">Kirim</button>
        </div>
    </div>

    <!-- SCRIPT UTAMA: LIVE2D + OTAK OFFLINE -->
    <script>
        const { Application, live2d } = PIXI;
        const { Live2DModel } = live2d;

        let mikaModel = null;
        let aiEngine = null; // Slot variabel otak offline kamu
        
        const statusEl = document.getElementById('ai-status');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatHistory = document.getElementById('chat-history');

        // 1. LOAD LIVE2D
        async function initLive2D() {
            try {
                const app = new Application({
                    view: document.getElementById('live2d-canvas'),
                    transparent: true,
                    autoStart: true,
                    resizeTo: document.getElementById('live2d-container')
                });

                const modelUrl = './live2d/hiyori_ja01/hiyori_free/runtime/hiyori_free_t08.model3.json';
                mikaModel = await Live2DModel.from(modelUrl);
                app.stage.addChild(mikaModel);

                mikaModel.scale.set(0.17);
                mikaModel.anchor.set(0.5, 0.5);
                mikaModel.x = app.screen.width / 2;
                mikaModel.y = app.screen.height / 2 + 35;
                mikaModel.autoInteract = true;

                statusEl.innerText = "Mika AI: Live2D Ready";
            } catch (err) {
                console.error("Gagal load Live2D:", err);
                statusEl.innerText = "Live2D Error";
            }
        }

        initLive2D();

        // 2. LOAD OTAK OFFLINE (Contoh Inisialisasi Model 1.5B Kamu)
        async function initAIOffline() {
            try {
                statusEl.innerText = "Mika AI: Loading 1.5B Model (Mohon tunggu)...";
                
                // ==========================================================
                // ⚠️ TARUH SKRIP INIT ENGINE OFFLINE LU DI SINI 
                // (Contoh jika pakai WebLLM / Transformers.js / ONNX)
                // ==========================================================
                // aiEngine = await CreateMLCEngine("Qwen1.5-1.5B-Chat-q4f32_1-MLC");
                
                statusEl.innerText = "Mika AI: 1.5B Ready (Offline)";
            } catch (err) {
                console.error("Gagal load AI Model:", err);
                statusEl.innerText = "AI Model Error / RAM Terbatas";
            }
        }

        // Panggil fungsi load AI offline saat halaman dibuka
        initAIOffline();

        // 3. TRIGGER KETIKAN
        userInput.addEventListener('input', () => {
            if (mikaModel) mikaModel.motion('TapBody');
        });

        // 4. KIRIM PESAN & PROSES AI
        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('User', text, 'user-msg');
            userInput.value = '';

            if (mikaModel) mikaModel.motion('TapBody');

            statusEl.innerText = "Mika AI: Thinking...";
            const aiMessageDiv = appendMessage('Mika', '...', 'ai-msg');
            const textSpan = aiMessageDiv.querySelector('.text-body');

            try {
                // ==========================================================
                // ⚠️ TARUH SKRIP GENERATE / STREAMING JAWABAN AI LU DI SINI
                // ==========================================================
                // const reply = await aiEngine.chat.completions.create({ messages: [...] });
                // let aiReplyText = reply.choices[0].message.content;

                let aiReplyText = "Halo Lek! Otak 1.5B offline kamu sukses terhubung ke web ini."; // Dummy respon sebelum dipasok engine lu

                textSpan.innerText = aiReplyText;
                statusEl.innerText = "Mika AI: Ready";

                if (mikaModel) mikaModel.motion('TapBody');

            } catch (error) {
                console.error("AI Error:", error);
                textSpan.innerText = "Gagal memproses AI.";
                statusEl.innerText = "AI Error";
            }
        }

        function appendMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<b>${sender}:</b> <span class="text-body">${text}</span>`;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return msgDiv;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
