<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika AI</title>
    
    <!-- CSS / Style Kamu -->
    <style>
        /* Style UI Chat & Canvas */
    </style>

    <!-- CDN Library (Ditaruh di Head) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
</head>
<body>

    <!-- HTML Elemen UI -->
    <div id="live2d-container">
        <canvas id="live2d-canvas"></canvas>
    </div>

    <div id="chat-container">
        <div id="chat-history"></div>
        <input type="text" id="user-input">
        <button id="send-btn">Kirim</button>
    </div>

    <!-- ⬇️ NAH SCRIPT JS DITARUH DI SINI (SEBELUM </body>) ⬇️ -->
    <script>
        const { Application, live2d } = PIXI;
        const { Live2DModel } = live2d;

        let mikaModel = null;

        async function initLive2D() {
            const app = new Application({
                view: document.getElementById('live2d-canvas'),
                transparent: true,
                autoStart: true,
                resizeTo: document.getElementById('live2d-container')
            });

            // PATH MODEL HIYORI KAMU DI SINI:
            const modelUrl = './live2d/hiyori_ja01/hiyori_free/runtime/hiyori_free_t08.model3.json';

            try {
                mikaModel = await Live2DModel.from(modelUrl);
                app.stage.addChild(mikaModel);

                mikaModel.scale.set(0.18);
                mikaModel.anchor.set(0.5, 0.5);
                mikaModel.x = app.screen.width / 2;
                mikaModel.y = app.screen.height / 2 + 60;
                mikaModel.autoInteract = true;

            } catch (err) {
                console.error("Gagal load Hiyori:", err);
            }
        }

        initLive2D();

        // Trigger Gerakan Pas User Ngetik
        const userInput = document.getElementById('user-input');
        userInput.addEventListener('input', () => {
            if (mikaModel) {
                mikaModel.motion('TapBody');
            }
        });
    </script>
</body>
</html>
