<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mika AI Chatbot</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ----------------------------------------------------
           1. CONTAINER LIVE2D (BAGIAN ATAS LAYAR)
        ---------------------------------------------------- */
        #live2d-container {
            width: 100%;
            height: 52vh;
            position: relative;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
            touch-action: none;
        }

        #live2d-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ai-status {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(102, 252, 241, 0.4);
            color: #66fcf1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 20;
        }

        /* ----------------------------------------------------
           2. CONTAINER CHAT & INPUT (BAGIAN BAWAH LAYAR)
        ---------------------------------------------------- */
        #chat-container {
            height: 48vh;
            background: #1f2833;
            border-top: 2px solid #45a29e;
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* AREA CHAT BAR (TEMPAT RIWAYAT PESAN) */
        #chat-bar {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 6px;
            margin-bottom: 14px;
            scroll-behavior: smooth;
        }

        /* Style Scrollbar Chat Bar */
        #chat-bar::-webkit-scrollbar {
            width: 4px;
        }
        #chat-bar::-webkit-scrollbar-thumb {
            background: #45a29e;
            border-radius: 4px;
        }

        /* GELEMBUNG PESAN (BUBBLE CHAT) */
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: #45a29e;
            color: #0b0c10;
            font-weight: 600;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background: #0b0c10;
            color: #c5c6c7;
            border: 1px solid #323846;
            border-bottom-left-radius: 2px;
        }

        /* AREA INPUT & TOMBOL KIRIM */
        .input-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid #45a29e;
            background: #0b0c10;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        #user-input:focus {
            border-color: #66fcf1;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.35);
        }

        #send-btn {
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            background: #66fcf1;
            color: #0b0c10;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        #send-btn:active {
            transform: scale(0.95);
            background: #45a29e;
        }
    </style>

    <!-- LIBRARY LIVE2D (PIXIJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
</head>
<body>

    <!-- STATUS ENGINE AI -->
    <div id="ai-status">Mika AI: Initializing...</div>

    <!-- 1. TAMPILAN KARAKTER LIVE2D -->
    <div id="live2d-container">
        <canvas id="live2d-canvas"></canvas>
    </div>

    <!-- 2. TAMPILAN CHAT BAR & INPUT BAR -->
    <div id="chat-container">
        <!-- CHAT BAR (RIWAYAT OBROLAN) -->
        <div id="chat-bar">
            <div class="message ai-msg">
                <b>Mika:</b> Halo Lek! Hiyori dan Chat Bar udah siap nih. Ngetik apa aja di bawah ya! 🍸🗿
            </div>
        </div>

        <!-- INPUT BAR (KOLOM NGETIK & KIRIM) -->
        <div class="input-bar">
            <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off">
            <button id="send-btn">Kirim</button>
        </div>
    </div>

    <!-- 3. SCRIPT LOGIC LIVE2D & AI OFFLINE -->
    <script>
        const { Application, live2d } = PIXI;
        const { Live2DModel } = live2d;

        let mikaModel = null;
        
        const statusEl = document.getElementById('ai-status');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBar = document.getElementById('chat-bar');

        // A. INITIALIZE LIVE2D
        async function initLive2D() {
            try {
                const app = new Application({
                    view: document.getElementById('live2d-canvas'),
                    transparent: true,
                    autoStart: true,
                    resizeTo: document.getElementById('live2d-container')
                });

                const modelUrl = './live2d/hiyori_ja01/hiyori_free/runtime/hiyori_free_t08.model3.json';
                mikaModel = await Live2DModel.from(modelUrl);
                app.stage.addChild(mikaModel);

                mikaModel.scale.set(0.17);
                mikaModel.anchor.set(0.5, 0.5);
                mikaModel.x = app.screen.width / 2;
                mikaModel.y = app.screen.height / 2 + 35;
                mikaModel.autoInteract = true;

                statusEl.innerText = "Mika AI: Live2D Ready";
            } catch (err) {
                console.error("Gagal load Live2D:", err);
                statusEl.innerText = "Live2D Error";
            }
        }

        initLive2D();

        // B. TRIGGER HIYORI PAS NGETIK
        userInput.addEventListener('input', () => {
            if (mikaModel) mikaModel.motion('TapBody');
        });

        // C. LOGIC KIRIM PESAN KE CHAT BAR
        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Tampilkan pesan user ke Chat Bar
            appendMessage('User', text, 'user-msg');
            userInput.value = '';

            if (mikaModel) mikaModel.motion('TapBody');

            statusEl.innerText = "Mika AI: Thinking (1.5B)...";
            const aiMessageDiv = appendMessage('Mika', '...', 'ai-msg');
            const textSpan = aiMessageDiv.querySelector('.text-body');

            try {
                // ==========================================================
                // ⚠️ SKRIP OFFLINE MODEL 1.5B KAMU BISA DIHUBUNGKAN DI SINI
                // ==========================================================
                
                let aiReplyText = "Model 1.5B siap merespon pesan kamu di Chat Bar, Lek!";

                textSpan.innerText = aiReplyText;
                statusEl.innerText = "Mika AI: Ready";

                if (mikaModel) mikaModel.motion('TapBody');

            } catch (error) {
                console.error("AI Error:", error);
                textSpan.innerText = "Error memproses balasan AI.";
                statusEl.innerText = "AI Error";
            }
        }

        // FUNGSI NAMBAH BALASAN KE CHAT BAR
        function appendMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<b>${sender}:</b> <span class="text-body">${text}</span>`;
            chatBar.appendChild(msgDiv);
            chatBar.scrollTop = chatBar.scrollHeight; // Auto-scroll ke bawah
            return msgDiv;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
