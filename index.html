<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mika</title>
<style>
body{margin:0;font-family:sans-serif;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;height:100vh}
#status{padding:6px 10px;font-size:12px;color:#aaa}
#chat{flex:1;overflow-y:auto;padding:10px}
.m{margin:6px 0;padding:8px 12px;border-radius:12px;max-width:80%;width:fit-content;white-space:pre-wrap}
.u{background:#4a4e9c;margin-left:auto}.b{background:#2d2d4d}
#bar{display:flex;gap:6px;padding:8px}
input{flex:1;padding:10px;border-radius:10px;border:0}
button{padding:10px 14px;border:0;border-radius:10px;background:#e94560;color:#fff}
a.tb{color:#fff;background:#e94560;padding:8px 12px;border-radius:10px;text-decoration:none;display:inline-block;margin-top:6px}
</style></head><body>
<div id="status">Otak dimuat saat pesan pertama.</div>
<div id="chat"></div>
<div id="bar"><input id="in" placeholder="Ketik di sini..."><button id="kirim">Kirim</button></div>
<script type="module">
import { CreateMLCEngine } from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm";

/* ===== Pengaturan ===== */
const MODEL = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
const PERSONA = `Kamu adalah Mika, asisten pribadi yang santai dan ramah.
Selalu jawab dalam bahasa Indonesia gaul. Panggil user "Lek".
Jawab singkat, 1-3 kalimat.`;

/* ===== Daftar aplikasi (tambah sendiri di sini) ===== */
const A = p => `intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${p};end`;
const S = a => `intent:#Intent;action=${a};end`;
const APPS = {
  whatsapp: A("com.whatsapp"),
  youtube: A("com.google.android.youtube"),
  instagram: A("com.instagram.android"),
  spotify: A("com.spotify.music"),
  tiktok: A("com.ss.android.ugc.trill"),
  maps: A("com.google.android.apps.maps"),
  kamera: S("android.media.action.STILL_IMAGE_CAMERA"),
  pengaturan: S("android.settings.SETTINGS"),
  wifi: S("android.settings.WIFI_SETTINGS"),
  bluetooth: S("android.settings.BLUETOOTH_SETTINGS")
};

/* ===== Elemen & data ===== */
const chat = document.getElementById("chat");
const input = document.getElementById("in");
const status = document.getElementById("status");
let engine = null, sibuk = false;
let riwayat = JSON.parse(localStorage.getItem("riwayat") || "[]");
let ingatan = JSON.parse(localStorage.getItem("ingatan") || "[]");

function tampil(kelas, teks) {
  const d = document.createElement("div");
  d.className = "m " + kelas;
  d.textContent = teks;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
riwayat.forEach(m => tampil(m.role === "user" ? "u" : "b", m.content));

function simpanIngatan() {
  localStorage.setItem("ingatan", JSON.stringify(ingatan));
}
function sistem() {
  return PERSONA + (ingatan.length
    ? "\nHal yang kamu ingat tentang user:\n- " + ingatan.join("\n- ") : "");
}

/* ===== Perintah lokal (tanpa AI) ===== */
function perintah(teks) {
  const t = teks.toLowerCase();
  let m;
  if ((m = teks.match(/^ingat:\s*(.+)/i))) {
    ingatan.push(m[1].trim());
    simpanIngatan();
    tampil("b", "Oke Lek, aku catat.");
    return true;
  }
  if (t.includes("apa yang kamu ingat")) {
    tampil("b", ingatan.length ? "Yang aku ingat:\n- " + ingatan.join("\n- ") : "Belum ada yang aku ingat.");
    return true;
  }
  if (t === "lupa semua") {
    ingatan = [];
    simpanIngatan();
    tampil("b", "Semua ingatan sudah dihapus.");
    return true;
  }
  if ((m = t.match(/^(buka|bukain)\s+(.+)$/))) {
    const k = Object.keys(APPS).find(x => m[2].includes(x));
    if (!k) {
      tampil("b", "Aku belum kenal aplikasi itu. Tambahin dulu ke daftar APPS.");
      return true;
    }
    const d = tampil("b", "Siap, Lek. Tekan tombolnya.");
    d.appendChild(document.createElement("br"));
    const a = document.createElement("a");
    a.className = "tb";
    a.href = APPS[k];
    a.textContent = "Buka " + k;
    d.appendChild(a);
    return true;
  }
  return false;
}

/* ===== Otak offline ===== */
async function muatOtak() {
  if (engine) return;
  if (!navigator.gpu) throw new Error("HP/browser ini belum mendukung WebGPU.");
  engine = await CreateMLCEngine(MODEL, {
    initProgressCallback: p => { status.textContent = p.text; }
  });
  status.textContent = "Otak siap (offline).";
}

async function kirim() {
  const teks = input.value.trim();
  if (!teks || sibuk) return;
  input.value = "";
  tampil("u", teks);
  if (perintah(teks)) return;

  sibuk = true;
  riwayat.push({ role: "user", content: teks });
  const el = tampil("b", "...");
  try {
    await muatOtak();
    const pesan = [{ role: "system", content: sistem() }, ...riwayat.slice(-10)];
    const stream = await engine.chat.completions.create({
      messages: pesan, stream: true, max_tokens: 200, temperature: 0.6
    });
    let out = "";
    for await (const ch of stream) {
      out += ch.choices[0]?.delta?.content || "";
      el.textContent = out;
      chat.scrollTop = chat.scrollHeight;
    }
    riwayat.push({ role: "assistant", content: out });
    localStorage.setItem("riwayat", JSON.stringify(riwayat.slice(-30)));
  } catch (e) {
    riwayat.pop();
    el.textContent = "Error: " + e.message;
  }
  sibuk = false;
}

document.getElementById("kirim").onclick = kirim;
input.onkeydown = e => { if (e.key === "Enter") kirim(); };
</script>
</body></html>
