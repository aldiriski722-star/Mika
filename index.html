<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mika AI Chatbot</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Biar gak scroll selayar-layar */
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* WRAPPER UTAMA SATU LAYAR FULL */
        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* 1. CONTAINER LIVE2D (BAGIAN ATAS: 50% LAYAR) */
        #live2d-container {
            width: 100%;
            height: 50vh;
            position: relative;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
            touch-action: none;
            flex-shrink: 0;
        }

        #live2d-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ai-status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(102, 252, 241, 0.4);
            color: #66fcf1;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            z-index: 20;
        }

        /* 2. CONTAINER CHAT UI (BAGIAN BAWAH: 50% LAYAR) */
        #chat-container {
            width: 100%;
            height: 50vh;
            background: #1f2833;
            border-top: 2px solid #45a29e;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.7);
            flex-shrink: 0;
        }

        /* AREA RIWAYAT PESAN (CHAT BAR) */
        #chat-bar {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
            margin-bottom: 10px;
        }

        #chat-bar::-webkit-scrollbar {
            width: 4px;
        }
        #chat-bar::-webkit-scrollbar-thumb {
            background: #45a29e;
            border-radius: 4px;
        }

        /* BUBBLE CHAT */
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.4;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: #45a29e;
            color: #0b0c10;
            font-weight: 600;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background: #0b0c10;
            color: #c5c6c7;
            border: 1px solid #323846;
            border-bottom-left-radius: 2px;
        }

        /* AREA KOLOM NGETIK & BUTTON */
        .input-bar {
            display: flex;
            gap: 8px;
            width: 100%;
            height: 48px; /* Ukuran pasti */
        }

        #user-input {
            flex: 1;
            height: 100%;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid #45a29e;
            background: #0b0c10;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        #user-input:focus {
            border-color: #66fcf1;
        }

        #send-btn {
            height: 100%;
            padding: 0 18px;
            border-radius: 12px;
            border: none;
            background: #66fcf1;
            color: #0b0c10;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        #send-btn:active {
            transform: scale(0.95);
            background: #45a29e;
        }
    </style>

    <!-- LIBRARY LIVE2D (PIXIJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
</head>
<body>

    <div id="app-wrapper">
        <!-- 1. LIVE2D HIYORI -->
        <div id="live2d-container">
            <div id="ai-status">Mika AI: Initializing...</div>
            <canvas id="live2d-canvas"></canvas>
        </div>

        <!-- 2. CHAT UI (CHAT BAR + KOLOM INPUT) -->
        <div id="chat-container">
            <!-- CHAT BAR (TEMPAT BUBBLE CHAT) -->
            <div id="chat-bar">
                <div class="message ai-msg">
                    <b>Mika:</b> Nah! Sekarang kolom ngetiknya udah nongol kan, Lek? 🍸🗿
                </div>
            </div>

            <!-- INPUT BAR (TEMPAT NGETIK) -->
            <div class="input-bar">
                <input type="text" id="user-input" placeholder="Ketik pesan di sini..." autocomplete="off">
                <button id="send-btn">Kirim</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
