<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mika AI Chatbot</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* CONTAINER UTAMA LAYAR HP */
        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* 1. AREA KARAKTER LIVE2D (ATAS) */
        #live2d-container {
            width: 100%;
            height: 48vh;
            position: relative;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
            touch-action: none;
            flex-shrink: 0;
        }

        #live2d-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* STATUS BADGE MODEL AI & LIVE2D */
        #ai-status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(102, 252, 241, 0.4);
            color: #66fcf1;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            z-index: 20;
        }

        /* 2. AREA CHAT HISTORY (TENGAH) */
        #chat-container {
            width: 100%;
            height: calc(52vh - 60px); /* Sisa layar dikurangi tinggi input bar (60px) */
            background: #1f2833;
            border-top: 2px solid #45a29e;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.7);
        }

        #chat-bar {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
            padding-bottom: 10px;
        }

        /* SCROLLBAR BUBBLE CHAT */
        #chat-bar::-webkit-scrollbar {
            width: 4px;
        }
        #chat-bar::-webkit-scrollbar-thumb {
            background: #45a29e;
            border-radius: 4px;
        }

        /* STYLE BUBBLE PESAN */
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.4;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: #45a29e;
            color: #0b0c10;
            font-weight: 600;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background: #0b0c10;
            color: #c5c6c7;
            border: 1px solid #323846;
            border-bottom-left-radius: 2px;
        }

        /* 3. INPUT BAR (NEMPEL POKOKNYA DI DASAR LAYAR HP) */
        .input-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 60px;
            background: #0b0c10;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #45a29e;
            z-index: 999;
        }

        #user-input {
            flex: 1;
            height: 100%;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid #45a29e;
            background: #1f2833;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        #user-input:focus {
            border-color: #66fcf1;
        }

        #send-btn {
            height: 100%;
            padding: 0 18px;
            border-radius: 12px;
            border: none;
            background: #66fcf1;
            color: #0b0c10;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        #send-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>

    <!-- DEPENDENCIES LIVE2D (CUBISM 4 CORE + PIXIJS v6) -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.9/dist/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js"></script>
</head>
<body>

    <div id="app-wrapper">
        <!-- AREA 1: LIVE2D -->
        <div id="live2d-container">
            <div id="ai-status">Mika AI: Initializing...</div>
            <canvas id="live2d-canvas"></canvas>
        </div>

        <!-- AREA 2: CHAT BAR (RIWAYAT PESAN) -->
        <div id="chat-container">
            <div id="chat-bar">
                <div class="message ai-msg">
                    <b>Mika:</b> Halo Lek! Hiyori & Qwen2.5 1.5B siap dimuat. 🍸🗿
                </div>
            </div>
        </div>

        <!-- AREA 3: KOLOM INPUT NGETIK PESAN (FIXED AT BOTTOM) -->
        <div class="input-bar">
            <input type="text" id="user-input" placeholder="Ketik pesan di sini..." autocomplete="off">
            <button id="send-btn" disabled>Kirim</button>
        </div>
    </div>

    <!-- SCRIPT UTAMA UTUH (WEBLLM + LIVE2D) -->
    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        const { Application, live2d } = PIXI;
        const { Live2DModel } = live2d;

        let mikaModel = null;
        let engine = null;

        const statusEl = document.getElementById('ai-status');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBar = document.getElementById('chat-bar');

        // MODEL WEBMLLM QWEN 1.5B Pilihanmu:
        const SELECTED_MODEL = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";

        // =========================================================
        // A. INISIALISASI LIVE2D HIYORI
        // =========================================================
        async function initLive2D() {
            try {
                const canvas = document.getElementById('live2d-canvas');
                const container = document.getElementById('live2d-container');

                const app = new Application({
                    view: canvas,
                    transparent: true,
                    autoStart: true,
                    width: container.clientWidth,
                    height: container.clientHeight
                });

                // Path ke file hiyori_free_t08.model3.json
                const modelUrl = './live2d/hiyori_ja01/hiyori_free/runtime/hiyori_free_t08.model3.json';

                mikaModel = await Live2DModel.from(modelUrl);
                app.stage.addChild(mikaModel);

                // Atur Posisi dan Ukuran Model
                mikaModel.scale.set(0.15);
                mikaModel.anchor.set(0.5, 0.5);
                mikaModel.x = container.clientWidth / 2;
                mikaModel.y = container.clientHeight / 2 + 30;

                // Tracking Sentuhan Jari / Touch
                mikaModel.autoInteract = true;

                console.log("Live2D Loaded!");
            } catch (err) {
                console.error("Gagal load Live2D:", err);
                statusEl.innerText = "Error: File Live2D Gak Ketemu!";
            }
        }

        // =========================================================
        // B. INISIALISASI ENGINE WEBLLM (QWEN2.5 1.5B)
        // =========================================================
        async function initWebLLM() {
            try {
                statusEl.innerText = "Mika AI: Loading Qwen2.5...";
                
                engine = await webllm.CreateMLCEngine(
                    SELECTED_MODEL,
                    {
                        initProgressCallback: (progress) => {
                            statusEl.innerText = `Loading AI: ${Math.round(progress.progress * 100)}%`;
                        }
                    }
                );

                statusEl.innerText = "Mika AI: Ready (Offline)";
                sendBtn.disabled = false; // Buka tombol kirim jika engine selesai di-load

            } catch (err) {
                console.error("Gagal load WebLLM:", err);
                statusEl.innerText = "AI Error / WebGPU Unsupported";
            }
        }

        // Run Inisialisasi
        initLive2D();
        initWebLLM();

        // Trigger Gerakan Pas User Ngetik Teks
        userInput.addEventListener('input', () => {
            if (mikaModel) mikaModel.motion('TapBody');
        });

        // =========================================================
        // C. PROSES KIRIM PESAN & STREAMING RESPON AI
        // =========================================================
        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text || !engine) return;

            // 1. Render pesan user di chat bar
            appendMessage('User', text, 'user-msg');
            userInput.value = '';
            sendBtn.disabled = true;

            if (mikaModel) mikaModel.motion('TapBody');

            // 2. Render bubble tempat balasan AI
            statusEl.innerText = "Mika AI: Thinking...";
            const aiMsgDiv = appendMessage('Mika', '', 'ai-msg');
            const textSpan = aiMsgDiv.querySelector('.text-body');

            try {
                const messages = [
                    { role: "system", content: "Kamu adalah Mika, asisten AI yang santai, ramah, dan membantu." },
                    { role: "user", content: text }
                ];

                // 3. Request streaming response dari Qwen2.5
                const chunks = await engine.chat.completions.create({
                    messages,
                    stream: true
                });

                let fullReply = "";
                for await (const chunk of chunks) {
                    const delta = chunk.choices[0]?.delta?.content || "";
                    fullReply += delta;
                    textSpan.innerText = fullReply;
                    chatBar.scrollTop = chatBar.scrollHeight;

                    // Trigger gerakan acak Hiyori pas streaming teks
                    if (mikaModel && Math.random() < 0.15) {
                        mikaModel.motion('TapBody');
                    }
                }

                statusEl.innerText = "Mika AI: Ready";

            } catch (error) {
                console.error("Chat Error:", error);
                textSpan.innerText = "Maaf Lek, terjadi error saat AI merespon.";
                statusEl.innerText = "AI Error";
            } finally {
                sendBtn.disabled = false;
            }
        }

        // HELPER UTILITY UNTUK CHAT BUBBLE
        function appendMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<b>${sender}:</b> <span class="text-body">${text}</span>`;
            chatBar.appendChild(msgDiv);
            chatBar.scrollTop = chatBar.scrollHeight;
            return msgDiv;
        }

        // EVENT LISTENERS
        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
