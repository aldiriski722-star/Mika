<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mika AI Chatbot</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* LAYOUT UTAMA SATU LAYAR */
        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* 1. CONTAINER LIVE2D (ATAS: 50%) */
        #live2d-container {
            width: 100%;
            height: 50vh;
            position: relative;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
            touch-action: none;
            flex-shrink: 0;
        }

        #live2d-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ai-status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(102, 252, 241, 0.4);
            color: #66fcf1;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            z-index: 20;
        }

        /* 2. CONTAINER CHAT UI (BAWAH: 50%) */
        #chat-container {
            width: 100%;
            height: 50vh;
            background: #1f2833;
            border-top: 2px solid #45a29e;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.7);
            flex-shrink: 0;
        }

        /* RIWAYAT PESAN (CHAT BAR) */
        #chat-bar {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
            margin-bottom: 10px;
        }

        #chat-bar::-webkit-scrollbar {
            width: 4px;
        }
        #chat-bar::-webkit-scrollbar-thumb {
            background: #45a29e;
            border-radius: 4px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.4;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: #45a29e;
            color: #0b0c10;
            font-weight: 600;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background: #0b0c10;
            color: #c5c6c7;
            border: 1px solid #323846;
            border-bottom-left-radius: 2px;
        }

        /* INPUT BAR (KOLOM NGETIK & TOMBOL KIRIM) - DIJAMIN NONGOL */
        .input-bar {
            display: flex;
            gap: 8px;
            width: 100%;
            height: 48px;
            flex-shrink: 0;
        }

        #user-input {
            flex: 1;
            height: 100%;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid #45a29e;
            background: #0b0c10;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        #user-input:focus {
            border-color: #66fcf1;
        }

        #send-btn {
            height: 100%;
            padding: 0 18px;
            border-radius: 12px;
            border: none;
            background: #66fcf1;
            color: #0b0c10;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        #send-btn:active {
            transform: scale(0.95);
            background: #45a29e;
        }
    </style>

    <!-- LIBRARY LIVE2D (PIXIJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
</head>
<body>

    <div id="app-wrapper">
        <!-- 1. LIVE2D HIYORI -->
        <div id="live2d-container">
            <div id="ai-status">Mika AI: Initializing...</div>
            <canvas id="live2d-canvas"></canvas>
        </div>

        <!-- 2. CHAT UI (CHAT BAR + INPUT BAR) -->
        <div id="chat-container">
            <div id="chat-bar">
                <div class="message ai-msg">
                    <b>Mika:</b> Halo Lek! Hiyori, Chat Bar, dan kolom ngetik udah lengkap di sini. 🍸🗿
                </div>
            </div>

            <!-- KOLOM NGETIK (INPUT BAR) -->
            <div class="input-bar">
                <input type="text" id="user-input" placeholder="Ketik pesan di sini..." autocomplete="off">
                <button id="send-btn">Kirim</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        const { Application, live2d } = PIXI;
        const { Live2DModel } = live2d;

        let mikaModel = null;
        let aiEngine = null; // SLOT OTAK OFFLINE 1.5B

        const statusEl = document.getElementById('ai-status');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBar = document.getElementById('chat-bar');

        // A. INISIALISASI LIVE2D HIYORI
        async function initLive2D() {
            try {
                const app = new Application({
                    view: document.getElementById('live2d-canvas'),
                    transparent: true,
                    autoStart: true,
                    resizeTo: document.getElementById('live2d-container')
                });

                const modelUrl = './live2d/hiyori_ja01/hiyori_free/runtime/hiyori_free_t08.model3.json';
                mikaModel = await Live2DModel.from(modelUrl);
                app.stage.addChild(mikaModel);

                mikaModel.scale.set(0.16);
                mikaModel.anchor.set(0.5, 0.5);
                mikaModel.x = app.screen.width / 2;
                mikaModel.y = app.screen.height / 2 + 20;
                mikaModel.autoInteract = true;

                statusEl.innerText = "Mika AI: Live2D Ready";
            } catch (err) {
                console.error("Gagal load Live2D:", err);
                statusEl.innerText = "Live2D Error";
            }
        }

        initLive2D();

        // B. INISIALISASI MODEL OFFLINE 1.5B (SILAKAN TARUH SKRIP LU DI SINI)
        async function initAIOffline() {
            try {
                statusEl.innerText = "Mika AI: Loading 1.5B Model...";
                
                // ==========================================================
                // ⚠️ TEMPEL SKRIP LOAD ENGINE / MODEL OFFLINE 1.5B LU DI SINI
                // ==========================================================
                
                statusEl.innerText = "Mika AI: Ready (Offline)";
            } catch (err) {
                console.error("Gagal load AI:", err);
                statusEl.innerText = "AI Load Error";
            }
        }

        initAIOffline();

        // C. TRIGGER GERAKAN PAS NGETIK
        userInput.addEventListener('input', () => {
            if (mikaModel) mikaModel.motion('TapBody');
        });

        // D. KIRIM PESAN & PROSES AI
        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('User', text, 'user-msg');
            userInput.value = '';

            if (mikaModel) mikaModel.motion('TapBody');

            statusEl.innerText = "Mika AI: Thinking...";
            const aiMessageDiv = appendMessage('Mika', '...', 'ai-msg');
            const textSpan = aiMessageDiv.querySelector('.text-body');

            try {
                // ==========================================================
                // ⚠️ TEMPEL SKRIP GENERATE / STREAMING AI 1.5B LU DI SINI
                // ==========================================================
                
                let aiReplyText = "Model 1.5B kamu siap dipasang di sini, Lek!";

                textSpan.innerText = aiReplyText;
                statusEl.innerText = "Mika AI: Ready";

                if (mikaModel) mikaModel.motion('TapBody');

            } catch (error) {
                console.error("AI Error:", error);
                textSpan.innerText = "Gagal memproses AI.";
                statusEl.innerText = "AI Error";
            }
        }

        function appendMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<b>${sender}:</b> <span class="text-body">${text}</span>`;
            chatBar.appendChild(msgDiv);
            chatBar.scrollTop = chatBar.scrollHeight;
            return msgDiv;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
